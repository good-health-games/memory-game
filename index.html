<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圖像記憶遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 避免手機點擊時出現高亮 */
        * { -webkit-tap-highlight-color: transparent; outline: none !important; }
        .shape-btn { transition: transform 0.1s ease; }
        .shape-btn:active { transform: scale(0.95); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <link rel="apple-touch-icon" href="./logo.png">
    <link rel="icon" type="image/png" href="./logo.png">
    
    <link id="manifest-link" rel="manifest" href="">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-none">

    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden min-h-[600px] flex flex-col relative">
        </div>

    <script>
        // --- 1. PWA 設定 (升級版路徑計算) ---
        // 確保無論有沒有 trailing slash，都能抓到正確的 GitHub 資料夾路徑
        let path = window.location.pathname;
        let folderPath = path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1);
        let baseUrl = window.location.origin + folderPath;

        const manifest = {
            "name": "圖像記憶遊戲",
            "short_name": "記憶遊戲",
            "start_url": baseUrl + "index.html",
            "display": "standalone",
            "background_color": "#203656",
            "theme_color": "#203656",
            "icons": [
                {
                    "src": baseUrl + "logo.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                },
                {
                    "src": baseUrl + "logo.png",
                    "sizes": "192x192",
                    "type": "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('fetch', (e) => {
                e.respondWith(fetch(e.request).catch(() => new Response('請連接網路。')));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
        }

        // --- 2. 遊戲資料設定 ---
        const TOTAL_ROUNDS = 10;
        const MEMORY_TIME = 10;
        
        const shapesPool = [
            { id: 'circle', name: '圓形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-red-500 fill-current"><circle cx="50" cy="50" r="45"/></svg>' },
            { id: 'triangle', name: '三角形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-blue-500 fill-current"><polygon points="50,5 95,95 5,95"/></svg>' },
            { id: 'square', name: '正方形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-green-500 fill-current"><rect x="10" y="10" width="80" height="80" rx="10"/></svg>' },
            { id: 'star', name: '星形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-yellow-400 fill-current"><polygon points="50,5 61,40 98,40 68,62 79,95 50,75 21,95 32,62 2,40 39,40"/></svg>' },
            { id: 'diamond', name: '菱形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-purple-500 fill-current"><polygon points="50,5 95,50 50,95 5,50"/></svg>' },
            { id: 'heart', name: '心形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-pink-500 fill-current"><path d="M50,88 C50,88 10,60 10,30 C10,15 25,5 40,15 C45,18 50,25 50,25 C50,25 55,18 60,15 C75,5 90,15 90,30 C90,60 50,88 50,88 Z"/></svg>' },
            { id: 'hexagon', name: '六角形', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-orange-500 fill-current"><polygon points="25,5 75,5 95,50 75,95 25,95 5,50"/></svg>' },
            { id: 'cross', name: '十字', svg: '<svg viewBox="0 0 100 100" class="w-full h-full text-teal-500 fill-current"><polygon points="35,5 65,5 65,35 95,35 95,65 65,65 65,95 35,95 35,65 5,65 5,35 35,35"/></svg>' }
        ];

        // --- 3. 遊戲狀態 ---
        let state = {
            view: 'START',
            lastView: '',
            round: 1,
            roundScores: [],
            targetSequence: [],
            recallOptions: [],
            playerSelection: [],
            timeLeft: MEMORY_TIME,
            timerInterval: null,
            showAnswer: false,
            errorReason: '',
            hasRetried: false
        };

        const appEl = document.getElementById('app');
        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

        // --- 5. 渲染函數 ---
        function render() {
            let content = '';
            const currentScore = state.roundScores.reduce((a, b) => a + b, 0);
            
            // 處理跨畫面動畫
            const animClass = state.lastView !== state.view ? 'fade-in' : '';
            state.lastView = state.view;

            // 頂部導覽列 (非首頁/結束頁才顯示)
            if (state.view !== 'START' && state.view !== 'END') {
                content += `
                    <div class="bg-blue-600 text-white rounded-t-3xl flex flex-col">
                        <div class="flex justify-between items-center px-5 pt-4 pb-1 text-sm font-medium text-blue-200">
                            <button onclick="goHome()" class="hover:text-white flex items-center gap-1 transition-colors active:scale-95 focus:outline-none focus:ring-0">
                                首頁
                            </button>
                            ${state.round > 1 ? `
                            <button onclick="prevRound()" class="hover:text-white flex items-center gap-1 transition-colors active:scale-95 focus:outline-none focus:ring-0">
                                上一題
                            </button>` : '<span></span>'}
                        </div>
                        <div class="px-5 pb-4 pt-2 flex justify-between items-center">
                            <div class="font-bold text-lg">第 ${state.round} / ${TOTAL_ROUNDS} 題</div>
                            <div class="font-bold text-base bg-blue-700/50 px-3 py-1 rounded-xl">分數: ${currentScore}</div>
                        </div>
                    </div>
                `;
            }

            switch(state.view) {
                case 'START':
                    content += `
                        <div class="flex-1 flex flex-col w-full bg-blue-50 p-4 pt-5 ${animClass}">
                            <!-- 深藍色實心質感卡片 -->
                            <div class="w-full bg-[#203656] text-white flex flex-col items-center pt-8 pb-8 px-4 rounded-[1.8rem] shadow-sm relative">
                                <div class="mb-4">
                                    <svg viewBox="0 0 100 115" class="w-14 h-16 mx-auto" fill="none">
                                        <path d="M 12 5 L 88 5 Q 95 5 95 12 L 95 60 A 45 45 0 0 1 5 60 L 5 12 Q 5 5 12 5 Z" stroke="white" stroke-width="5"/>
                                        <text x="50" y="70" fill="white" font-family="sans-serif" font-weight="bold" font-size="48" text-anchor="middle">GH</text>
                                    </svg>
                                </div>
                                <div class="mb-5 text-center">
                                    <h2 class="text-xl font-bold tracking-[0.2em] mb-1">康傑教育機構</h2>
                                    <p class="text-[0.45rem] tracking-[0.05em] uppercase opacity-90 font-medium font-sans">Good Health Early Childhood Education Group</p>
                                </div>
                                <div class="mb-5 text-center font-sans">
                                    <h3 class="text-[1.05rem] font-bold tracking-[0.15em] mb-1">康傑中英文幼稚園</h3>
                                    <h3 class="text-[1.05rem] font-bold tracking-[0.15em] mb-2">康傑幼兒中心</h3>
                                    <p class="text-[0.55rem] opacity-80 leading-relaxed font-medium">Good Health Anglo-Chinese Kindergarten<br>Good Health Child Care Centre</p>
                                </div>
                                <div class="w-full max-w-[260px] h-[1px] bg-white/20 my-4"></div>
                                <div class="text-center mt-2">
                                    <h1 class="text-2xl font-bold tracking-[0.15em] mb-2">圖像記憶遊戲</h1>
                                    <p class="text-[0.65rem] tracking-[0.2em] text-[#a8c7fa] uppercase font-bold">Image Memory Game</p>
                                </div>
                            </div>
                            
                            <!-- 遊戲規則 -->
                            <div class="mt-6 mb-auto px-4">
                                <ol class="list-decimal pl-4 space-y-1.5 font-medium text-[0.85rem] text-slate-600 leading-relaxed">
                                    <li>記住出現的 <span class="text-[#203656] font-bold">3 個圖形</span>與<span class="text-[#203656] font-bold">順序</span>。</li>
                                    <li>你有 10 秒的記憶時間。</li>
                                    <li>從 6 個選項中，按正確順序選出剛才的圖形。</li>
                                    <li>答對得 10 分，答錯 0 分。</li>
                                </ol>
                            </div>

                            <!-- 開始遊戲按鈕 (已修正重複語法並加上 focus:outline-none) -->
                            <button onclick="prepareRound()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg mt-6 focus:outline-none focus:ring-0">
                                開始遊戲
                            </button>
                        </div>
                    `;
                    break;

                case 'PRE_MEMORIZE':
                    content += `
                        <div class="flex-1 flex flex-col items-center justify-center p-8 text-center ${animClass}">
                            <h2 class="text-2xl font-bold text-slate-800 mb-4">第 ${state.round} 題準備</h2>
                            <p class="text-slate-600 mb-8">準備好後請點擊開始，你將有 10 秒鐘記住圖形。</p>
                            <button onclick="beginMemorize()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg focus:outline-none focus:ring-0">
                                開始記憶
                            </button>
                        </div>
                    `;
                    break;

                case 'MEMORIZE':
                    const progressWidth = (state.timeLeft / MEMORY_TIME) * 100;
                    content += `
                        <div class="flex-1 flex flex-col p-6 ${animClass}">
                            <div class="text-center mb-8 mt-4">
                                <h2 class="text-xl font-bold text-slate-800 mb-2">請記住以下圖形順序 (左至右)</h2>
                                <div id="timer-text" class="text-3xl font-black text-blue-600">${state.timeLeft}s</div>
                            </div>
                            
                            <div class="w-full bg-slate-200 rounded-full h-3 mb-10 overflow-hidden">
                                <div id="progress-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-1000 linear" style="width: ${progressWidth}%"></div>
                            </div>
                            
                            <div class="flex justify-center gap-4">
                                ${state.targetSequence.map((shape, idx) => `
                                    <div class="flex flex-col items-center">
                                        <div class="w-24 h-24 bg-slate-50 p-3 rounded-2xl shadow-md border border-slate-200">
                                            ${shape.svg}
                                        </div>
                                        <span class="mt-3 text-lg text-slate-500 font-bold">${idx + 1}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'RECALL':
                    content += `
                        <div class="flex-1 flex flex-col p-6 ${animClass}">
                            <div class="text-center mb-6 mt-2">
                                <h2 class="text-xl font-bold text-slate-800">請按剛才的順序選出 3 個圖形</h2>
                            </div>
                            
                            <!-- 玩家選擇區 -->
                            <div class="flex justify-center gap-4 mb-8 h-32">
                                ${[0, 1, 2].map(i => {
                                    const selected = state.playerSelection[i];
                                    return `
                                        <div ${selected ? `onclick="deselectShape(${i})"` : ''} class="w-28 h-28 rounded-2xl border-2 flex items-center justify-center transition-all ${selected ? 'border-blue-500 bg-blue-50 cursor-pointer active:scale-95 hover:border-red-400 hover:bg-red-50' : 'border-dashed border-slate-300 bg-slate-50'}">
                                            ${selected ? `<div class="w-20 h-20 pointer-events-none">${selected.svg}</div>` : `<span class="text-slate-300 text-2xl font-bold">${i+1}</span>`}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            
                            <!-- 選項區 -->
                            <div class="grid grid-cols-3 gap-4 mb-6">
                                ${state.recallOptions.map(shape => {
                                    const isSelected = state.playerSelection.find(s => s.id === shape.id);
                                    return `
                                        <div class="w-full aspect-square">
                                            <button onclick="selectShape('${shape.id}')" ${isSelected ? 'disabled' : ''} class="shape-btn w-full h-full bg-white border-2 border-slate-200 rounded-2xl p-4 flex items-center justify-center shadow-sm ${isSelected ? 'opacity-30 cursor-not-allowed' : 'hover:border-blue-400 active:bg-slate-50'} focus:outline-none focus:ring-0">
                                                <div class="w-full h-full pointer-events-none flex items-center justify-center">${shape.svg}</div>
                                            </button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            
                            <!-- 功能按鈕 -->
                            <div class="mt-auto pt-2 flex flex-col gap-3">
                                <button onclick="reWatchQuestion()" class="w-full font-bold py-3 rounded-xl transition-all border-2 border-blue-300 text-blue-600 hover:bg-blue-50 active:scale-95 focus:outline-none focus:ring-0">
                                    重新查看題目
                                </button>
                                <button onclick="resetSelection()" ${state.playerSelection.length > 0 ? '' : 'disabled'} class="w-full font-bold py-3 rounded-xl transition-all border-2 ${state.playerSelection.length > 0 ? 'border-slate-300 text-slate-600 hover:bg-slate-50 active:scale-95' : 'border-slate-100 text-slate-300 cursor-not-allowed bg-transparent'} focus:outline-none focus:ring-0">
                                    重設選項
                                </button>
                                <button onclick="checkResult()" ${state.playerSelection.length === 3 ? '' : 'disabled'} class="w-full font-bold py-4 rounded-2xl shadow-lg transition-all text-lg ${state.playerSelection.length === 3 ? 'bg-blue-600 hover:bg-blue-700 text-white active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} focus:outline-none focus:ring-0">
                                    檢查答案
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'RESULT':
                    const isCorrect = JSON.stringify(state.targetSequence.map(s=>s.id)) === JSON.stringify(state.playerSelection.map(s=>s.id));
                    content += `
                        <div class="flex-1 flex flex-col items-center justify-center p-8 text-center ${animClass}">
                            <div class="w-24 h-24 mb-6 ${isCorrect ? 'text-green-500' : 'text-red-500'}">
                                ${isCorrect ? 
                                    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>` : 
                                    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`
                                }
                            </div>
                            <h2 class="text-3xl font-bold mb-2 ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                                ${isCorrect ? '+10 分！答對了' : '答錯了！'}
                            </h2>
                            <p class="text-slate-500 mb-8 font-medium">
                                ${isCorrect ? '太棒了，記憶力真好！' : (state.showAnswer ? '正確順序如下：' : state.errorReason)}
                            </p>
                            
                            ${isCorrect ? `
                                <button onclick="nextRound()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg focus:outline-none focus:ring-0">
                                    ${state.round < TOTAL_ROUNDS ? '下一題' : '查看最終成績'}
                                </button>
                            ` : `
                                <div class="flex flex-col gap-3 w-full">
                                    ${state.showAnswer ? `
                                        <div class="flex justify-center gap-4 mb-6">
                                            ${state.targetSequence.map(shape => `
                                                <div class="w-28 h-28 bg-slate-50 p-4 rounded-3xl shadow-sm border border-slate-200">${shape.svg}</div>
                                            `).join('')}
                                        </div>
                                        <button onclick="nextRound()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition-transform text-lg focus:outline-none focus:ring-0">
                                            ${state.round < TOTAL_ROUNDS ? '下一題' : '查看最終成績'}
                                        </button>
                                    ` : `
                                        <button onclick="retryRound()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition-transform text-lg focus:outline-none focus:ring-0">
                                            重新作答 (無分)
                                        </button>
                                        <button onclick="revealAnswer()" class="w-full bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition-transform text-lg focus:outline-none focus:ring-0">
                                            顯示答案
                                        </button>
                                        <button onclick="nextRound()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition-transform text-lg focus:outline-none focus:ring-0">
                                            直接下一題
                                        </button>
                                    `}
                                </div>
                            `}
                        </div>
                    `;
                    break;

                case 'END':
                    let comment = currentScore === 100 ? "完美！你的記憶力異於常人！🏆" : (currentScore >= 70 ? "很厲害！差一點就滿分了！⭐" : (currentScore >= 40 ? "還不錯，再多練習幾次吧！👍" : "有點可惜，腦袋需要醒一醒囉！☕"));
                    content += `
                        <div class="flex-1 flex flex-col items-center justify-center p-8 text-center ${animClass}">
                            <h1 class="text-4xl font-black text-slate-800 mb-2">遊戲結束</h1>
                            <div class="text-6xl font-black text-blue-600 my-6">${currentScore} <span class="text-2xl text-slate-500 font-bold">分</span></div>
                            <p class="text-xl text-slate-600 mb-10 font-medium">${comment}</p>
                            
                            <button onclick="resetGame()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg flex items-center justify-center gap-2 focus:outline-none focus:ring-0">
                                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                                再玩一次
                            </button>
                        </div>
                    `;
                    break;
            }

            appEl.innerHTML = content;
        }

        // --- 6. 遊戲流程控制 ---
        window.prepareRound = function() {
            const shuffledPool = shuffle(shapesPool);
            state.targetSequence = shuffledPool.slice(0, 3);
            
            const remainingPool = shuffledPool.slice(3);
            state.recallOptions = shuffle([...state.targetSequence, ...remainingPool.slice(0, 3)]);
            
            state.playerSelection = [];
            state.timeLeft = MEMORY_TIME;
            state.showAnswer = false;
            state.errorReason = '';
            state.hasRetried = false; 
            state.view = 'PRE_MEMORIZE'; 
            
            render();
        }

        window.beginMemorize = function() {
            state.view = 'MEMORIZE';
            render(); 

            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                
                const timerEl = document.getElementById('timer-text');
                const progressEl = document.getElementById('progress-bar');
                
                if (timerEl) timerEl.innerText = state.timeLeft + 's';
                if (progressEl) progressEl.style.width = ((state.timeLeft / MEMORY_TIME) * 100) + '%';
                
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    state.view = 'RECALL';
                    render();
                }
            }, 1000);
        }

        window.selectShape = function(shapeId) {
            if (state.playerSelection.length >= 3) return;
            const shape = shapesPool.find(s => s.id === shapeId);
            state.playerSelection.push(shape);
            render();
        }

        window.deselectShape = function(index) {
            if (state.playerSelection[index]) {
                state.playerSelection.splice(index, 1);
                render();
            }
        }

        window.resetSelection = function() {
            if (state.playerSelection.length > 0) {
                state.playerSelection = [];
                render();
            }
        }

        window.reWatchQuestion = function() {
            state.playerSelection = []; 
            state.timeLeft = MEMORY_TIME; 
            state.view = 'PRE_MEMORIZE'; 
            render();
        }

        window.checkResult = function() {
            const isCorrect = state.targetSequence.every((targetShape, index) => {
                return state.playerSelection[index] && targetShape.id === state.playerSelection[index].id;
            });

            if (isCorrect) {
                if (!state.hasRetried) {
                    state.roundScores[state.round - 1] = 10;
                } else {
                    state.roundScores[state.round - 1] = 0;
                }
                state.errorReason = '';
            } else {
                state.roundScores[state.round - 1] = 0;
                
                const selectedIds = state.playerSelection.map(s => s.id);
                const targetIds = state.targetSequence.map(s => s.id);
                const hasAllCorrectShapes = targetIds.every(id => selectedIds.includes(id));
                
                if (hasAllCorrectShapes) {
                    state.errorReason = '圖形都選對了，但是順序不對喔！';
                } else {
                    state.errorReason = '圖形選擇錯誤喔！';
                }
            }
            
            state.view = 'RESULT';
            render();
        }

        window.retryRound = function() {
            state.hasRetried = true; 
            state.playerSelection = [];
            state.view = 'RECALL';
            render();
        }

        window.revealAnswer = function() {
            state.showAnswer = true;
            render();
        }

        window.nextRound = function() {
            if (state.round < TOTAL_ROUNDS) {
                state.round++;
                window.prepareRound();
            } else {
                state.view = 'END';
                render();
            }
        }
        
        window.goHome = function() {
            clearInterval(state.timerInterval);
            resetGame();
        }

        window.prevRound = function() {
            if (state.round > 1) {
                clearInterval(state.timerInterval);
                state.roundScores[state.round - 1] = 0;
                state.round--;
                state.roundScores[state.round - 1] = 0;
                window.prepareRound();
            }
        }

        window.resetGame = function() {
            state.round = 1;
            state.roundScores = []; 
            state.errorReason = '';
            state.hasRetried = false;
            state.view = 'START';
            render();
        }

        render();

    </script>
</body>
</html>
